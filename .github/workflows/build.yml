name: Build ZER0 CLIENT

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Use the newest Fabric / Yarn versions for 1.21.11
        run: bash tools/update-versions.sh || echo "version lookup failed, using gradle.properties as-is"

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace --no-daemon

      - name: Upload the mod jar
        uses: actions/upload-artifact@v4
        with:
          name: ZER0-CLIENT-jar
          path: build/dist/*.jar
